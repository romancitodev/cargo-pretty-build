[package]
name = "cargo-pretty-build"
description = "A cargo wrapper with a live, animated status view for build, run and test"
repository = "https://github.com/romancitodev/cargo-pretty"
authors = ["romancitodev"]
license = "MIT"
version = "0.3.0"
edition = "2024"

# The crates.io package keeps its original name (already published under it); the binary
# it produces is `cargo-pretty`, since that's the subcommand name cargo derives from it.
[[bin]]
name = "cargo-pretty"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23"
colorgrad = "0.8"
crossterm = "0.29"
eyre = "0.6"
serde_json = "1"
nobubbles = { version = "0.1.1", features = ["gradient"] }
